<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Availability Status</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent; 
        }

        #status-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.4s ease;
            cursor: pointer;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Status Background Colors */
        .green { background-color: #2e7d32; color: #ffffff; }
        .red { background-color: #c62828; color: #ffffff; }
        .yellow { background-color: #f57f17; color: #ffffff; } /* Focus Mode Yellow */

        h1 { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center;
            width: 100%;
            line-height: 1.1;
        }

        .subtext { 
            font-size: 1.5rem; 
            font-weight: 600;
            opacity: 0.95; 
            margin-top: 0.75rem; 
            text-align: center;
            width: 100%;
        }

        .knock-text {
            font-size: 1.1rem;
            opacity: 0.75;
            margin-top: 1.25rem;
            text-align: center;
            width: 100%;
        }

#status-icon {
    width: clamp(80px, 18vw, 150px);
    height: clamp(80px, 18vw, 150px);
    object-fit: contain;
    margin-bottom: 1.5rem;
    border-radius: 12px; /* Optional slight rounded corners */
}        
    </style>
</head>
<body class="green" id="body">
    <div id="status-container" onclick="sendNotification()">
        <img id="status-icon" src="https://via.placeholder.com/150" alt="Status Icon">
        <h1 id="status-text">AVAILABLE</h1>
        <p id="sub-text" class="subtext" style="display: none;"></p>
        <p class="knock-text">Tap screen to knock</p>
    </div>

    <script>
       let currentStatus = '';

async function checkStatus() {
    try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        if (data.status !== currentStatus) {
            currentStatus = data.status;
            const body = document.getElementById('body');
            const text = document.getElementById('status-text');
            const subText = document.getElementById('sub-text');
            const icon = document.getElementById('status-icon');
            
            if (currentStatus === 'red') {
                body.className = 'red';
                text.innerText = 'DO NOT DISTURB';
                subText.style.display = 'none';
                // Placeholder image for RED status
                icon.src = 'do_not_disturb_on_total_silence_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg';
            } else if (currentStatus === 'focus') {
                body.className = 'yellow';
                text.innerText = 'FOCUS MODE';
                subText.innerText = 'Knock if Important';
                subText.style.display = 'block';
                // Placeholder image for FOCUS status
                icon.src = './center_focus_strong_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg';
            } else {
                body.className = 'green';
                text.innerText = 'AVAILABLE';
                subText.style.display = 'none';
                // Placeholder image for GREEN status
                icon.src = 'check_circle_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg';
            }
        }
    } catch (err) {
        console.error('Polling error:', err);
    }
}

        // Client-side tap debouncer
        let isCooldown = false;
        async function sendNotification() {
            if (isCooldown) return;
            isCooldown = true;

            try {
                await fetch('/api/notify', { method: 'POST' });
            } catch (err) {
                console.error('Notification error:', err);
            }

            setTimeout(() => { isCooldown = false; }, 3000);
        }

        setInterval(checkStatus, 2000);
        checkStatus();
    </script>
</body>
</html>
